name: CI

on:
  push:
    branches: [main]
    # The prefix is fixed here because `on:` accepts no expressions: if
    # RELEASE_TAG_PREFIX is ever changed, this glob has to change with it.
    # [0-9] rather than * so the trigger cannot be caught by some other tag
    # that happens to begin with r.
    tags: ['r[0-9]*']
  pull_request:

permissions:
  contents: read

concurrency:
  # Superseded branch builds are worth cancelling; a tag build is not -- it is
  # the only run that will ever exist for that release.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true
      - name: Run the test suite
        run: uv run pytest

  verify-tag:
    name: The tag must name what the tree declares
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true
      - name: Check the tag against pyproject.toml
        id: verify
        env:
          TAG: ${{ github.ref_name }}
        run: uv run python .github/scripts/verify_tag.py

  github-release:
    name: Build and attach to a GitHub Release
    needs: [test, verify-tag]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the Release
      id-token: write        # to sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          # Deliberately uncached: a release build should not be able to pick
          # up anything a branch build left behind.
          enable-cache: false
      - name: Build the sdist and wheel from the tagged tree
        run: uv build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'
      - name: Create the Release and attach the artefacts
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--generate-notes --verify-tag)
          # rc/alpha/beta are genuine releases and are tagged (ADR-0009), so
          # they get a Release -- flagged, so nothing reads an rc as current.
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            "${args[@]}" \
            dist/*
