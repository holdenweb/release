[project]
name = "release"
version = "0.1.18"
description = "Release control process"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "packaging>=25.0",
 "semver>=3.0.4",
 "tomlkit>=0.13.3",
]
[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
release = "release:main"
pp-ver = "setver:pp_version_cli"
