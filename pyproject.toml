[project]
name = "release"
version = "0.7.2"
description = "Release control process"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "packaging>=26.2",
]
[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
release = "release.__main__:main"
v_next = "release:v_next_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises real `uv` and `git` in a throwaway project (slower)",
]
